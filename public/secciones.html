<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFRAMEN - Gestión de Secciones</title>
<link rel="icon" href="logo/logo1.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="secciones">
<div id="nav"></div>
<main>
<div class="titulo"><div><h1>Gestión de Secciones</h1><p>Administra las especialidades y secciones del instituto.</p></div>
<button class="btn accion" id="nuevo" data-ico="plus">Nueva Sección</button></div>
<div class="card filtros">
  <div class="buscar grow"><span data-ico="search"></span><input id="q" placeholder="Buscar especialidad, sección o docente..."></div>
  <select id="fesp"><option value="">Todas las especialidades</option></select>
  <select id="fest"><option value="">Todas las secciones</option><option value="1">Activas</option><option value="0">Inactivas</option></select>
</div>
<div class="stats" id="stats"></div>
<div class="dos-col">
  <div class="card bloque"><h2>Lista de secciones</h2>
  <div class="tabla-scroll"><table class="tabla-cards"><thead><tr><th>ID</th><th>Especialidad</th><th>Sección</th><th>Docente asignado</th><th>Estudiantes</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="pie-tabla"><span id="info"></span><div class="pag" id="pag"></div></div></div>
  <div class="card bloque detalle"><h2>Detalle de la sección</h2><div id="det"></div></div>
</div>
</main>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
