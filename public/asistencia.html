<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFRAMEN - Registro de Asistencia Docente</title>
<link rel="icon" href="logo/logo1.png">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="asistencia">
<div id="nav"></div>
<main>
<div class="titulo"><div><h1>Registro de Asistencia Docente</h1><p>Marca la asistencia de los estudiantes por sección y fecha.</p></div></div>
<div class="sel-barra">
  <div class="campo"><span data-ico="calendar"></span><input type="date" id="fecha" aria-label="Fecha"></div>
  <div class="campo"><span data-ico="layers"></span><select id="sec" aria-label="Sección"></select></div>
  <button class="btn" id="cargar" data-ico="download">Descargar asistencia (PDF)</button>
</div>
<div class="asis-grid" id="cuerpo">
  <div class="card bloque"><h2>Lista de estudiantes</h2>
    <div class="buscar" style="margin-bottom:12px"><span data-ico="search"></span><input id="q" placeholder="Buscar estudiante..." style="width:100%"></div>
    <div class="tabla-scroll"><table class="tabla-cards asis"><thead><tr><th style="width:40px"></th><th>Estudiante (apellidos, nombres)</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div class="pie-tabla"><span id="info"></span><div class="pag" id="pag"></div></div></div>
  <div style="display:grid;gap:18px">
    <div class="card bloque"><h2>Resumen de asistencia</h2>
      <div class="donut-wrap"><div class="donut" id="donut"><i><b id="pct">0%</b><small>Asistencia</small></i></div><ul class="leyenda" id="ley"></ul></div>
      <div class="total-linea" id="total"></div></div>
    <div class="card bloque"><h2>Acciones rápidas</h2><div class="rapidas">
      <button class="btn verde block" id="todos">Marcar todos como presentes</button>
      <button class="btn gris block" id="limpiar" data-ico="rotate">Limpiar selección</button>
      <button class="btn block" id="guardar" data-ico="save">Guardar asistencia</button></div></div>
  </div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
